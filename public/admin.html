<!doctype html>
<html lang="th" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แอดมิน · ระบบจองตั๋วชมโขนไทย</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
  <div class="khon-page">
    <div class="content-shell" style="max-width:960px;">

      <header class="pt-4 pb-4">
        <div class="glass p-4 d-flex align-items-center justify-content-between gap-3">
          <div class="hero-text">
            <p class="eyebrow mb-1">หลังบ้าน</p>
            <h1 class="h4 fw-bold text-white mb-0">ตรวจสอบและอนุมัติการจอง</h1>
          </div>
          <a href="index.html" class="btn btn-outline btn-sm">← กลับหน้าจองตั๋ว</a>
        </div>
      </header>

      <main>
        <!-- ===== หน้าล็อกอิน ===== -->
        <section id="admin-login-section" class="glass p-4 p-md-5 mx-auto" style="max-width:420px;">
          <h2 class="h5 text-gold fw-bold text-center mb-3">เข้าสู่ระบบแอดมิน</h2>
          <form id="admin-login-form">
            <label for="admin-password" class="form-label">รหัสผ่านแอดมิน</label>
            <input id="admin-password" class="form-control" type="password" autocomplete="current-password" required>
            <p id="admin-login-error" class="field-error"></p>
            <button id="admin-login-btn" type="submit" class="btn btn-gold w-100 rounded-3 py-2 mt-3">เข้าสู่ระบบ</button>
          </form>
        </section>

        <!-- ===== แดชบอร์ด ===== -->
        <section id="admin-dashboard-section" class="hidden">
          <div class="glass p-4 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
              <div>
                <h2 class="h5 text-gold fw-bold mb-1">รายการจองทั้งหมด</h2>
                <p class="text-white-50 mb-0">ตรวจสอบสลิปและอัปเดตสถานะการจอง</p>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <select id="showtime-filter" class="form-select form-select-sm">
                  <option value="all">ทุกรอบการแสดง</option>
                </select>
                <select id="status-filter" class="form-select form-select-sm">
                  <option value="all">ทุกสถานะ</option>
                  <option value="รอตรวจสอบการชำระเงิน">รอตรวจสอบการชำระเงิน</option>
                  <option value="อนุมัติแล้ว">อนุมัติแล้ว</option>
                  <option value="ปฏิเสธแล้ว">ปฏิเสธแล้ว</option>
                </select>
                <button id="refresh-btn" type="button" class="btn btn-outline btn-sm">รีเฟรช</button>
                <button id="logout-btn" type="button" class="btn btn-outline btn-sm">ออกจากระบบ</button>
              </div>
            </div>
            <div class="mt-3">
              <label for="search-booking" class="visually-hidden">ค้นหาเลขที่การจอง</label>
              <input id="search-booking" type="search" class="form-control form-control-sm" style="max-width:420px;" placeholder="ค้นหาเลขที่การจอง เช่น KHON-20261010-AB12CD (ใช้เช็คหน้างาน)">
            </div>
            <div class="gold-rule"></div>
            <p id="admin-message" class="notice notice-info"></p>
            <div class="d-flex align-items-center gap-2 mt-2">
              <span class="text-white-50">รอตรวจสอบ:</span>
              <span id="pending-count" class="status-pill status-pending">0 รายการ</span>
            </div>
          </div>

          <div id="booking-list"></div>
          <p id="admin-empty" class="text-center text-white-50 py-5 hidden">ไม่พบรายการจองที่ตรงกับเงื่อนไข</p>
        </section>
      </main>
    </div>
  </div>

  <!-- ===== Modal รายละเอียดการจอง ===== -->
  <div class="modal fade" id="booking-detail-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-gold">รายละเอียดการจอง</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="ปิด"></button>
        </div>
        <div class="modal-body">
          <div id="detail-content"></div>
          <div class="mt-4">
            <p class="fw-bold text-gold mb-2">หลักฐานการชำระเงิน</p>
            <div id="detail-slip-container"></div>
          </div>
          <div class="mt-4">
            <label for="reject-reason" class="form-label">เหตุผลเมื่อปฏิเสธรายการ</label>
            <textarea id="reject-reason" class="form-control" rows="3"></textarea>
            <p id="admin-action-message" class="field-error"></p>
          </div>
        </div>
        <div class="modal-footer">
          <button id="reject-btn" type="button" class="btn btn-danger">ปฏิเสธรายการ</button>
          <button id="approve-btn" type="button" class="btn btn-gold">อนุมัติการจอง</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
